app = "mafiabazi"
primary_region = "sjc"

[build]

[env]
  PORT = "3000"
  DATABASE_URL = "file:/data/prod.db"
  APP_URL = "https://mafiabazi.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "data"
  destination = "/data"
